name: Java Verification

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java modules
        shell: powershell
        run: .\verify.ps1

      - name: Run Live Coding public tests
        shell: powershell
        run: .\test-live-coding.ps1
